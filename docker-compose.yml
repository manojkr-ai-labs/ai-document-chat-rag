version: "3.9"

services:
  ai-document-chat:
    build:
      context: .
      dockerfile: Dockerfile

    image: ai-document-chat:latest
    container_name: ai-document-chat

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      BASE_URL: http://host.docker.internal:11434

    volumes:
      - ./documents:/app/documents
      - ./storage:/app/storage
      - ./logs:/app/logs

    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge