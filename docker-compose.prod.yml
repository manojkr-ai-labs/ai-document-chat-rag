services:
  ai-document-chat:
    build:
      context: .
      dockerfile: Dockerfile

    image: ai-document-chat:latest
    container_name: ai-document-chat-prod

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment: 
      BASE_URL: http://host.docker.internal:11434

    volumes:
      - ./documents:/app/documents
      - ./storage:/app/storage
      - ./logs:/app/logs

    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000

    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge